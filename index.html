<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TapTyping</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json">
</head>
<body>
<header>
  <a class="logo" href="#">tap<i>typing</i></a>
  <nav>
    <button class="nav active" data-page="test">test</button>
    <button class="nav" data-page="rankings">rankings</button>
    <button class="nav" data-page="stats">stats</button>
  </nav>
  <div class="toolbar">
    <button id="timeMenu" class="tool active">time <span>15</span></button>
    <button id="wordsMenu" class="tool">words <span>25</span></button>
    <button id="restart" class="tool restart" title="Restart (Tab)">↻</button>
    <button id="theme" class="tool" title="Theme">☼</button>
  </div>
</header>
<div id="modeMenu" class="mode-menu hidden"></div>
<main>
<section id="test" class="page">
  <div class="live"><span><b id="wpm">0</b> wpm</span><span><b id="raw">0</b> raw</span><span><b id="acc">100</b>%</span><span><b id="time">15</b><small id="timeUnit">s</small></span></div>
  <div id="words" class="words" aria-label="Typing text"></div>
  <div class="hint"><kbd>tab</kbd> restart</div>
</section>
<section id="rankings" class="page hidden"><div class="head"><h1>rankings</h1><p>Your best saved scores.</p></div><div id="rankTable" class="table"></div></section>
<section id="stats" class="page hidden"><div class="head"><h1>stats</h1><p>Your TapTyping history.</p></div><div class="grid"><div class="stat"><small>best wpm</small><strong id="best">0</strong></div><div class="stat"><small>average wpm</small><strong id="average">0</strong></div><div class="stat"><small>tests</small><strong id="count">0</strong></div><div class="stat"><small>best accuracy</small><strong id="bestacc">0%</strong></div></div></section>
</main>
<div id="resultsOverlay" class="results-overlay hidden"><div class="results-modal"><button id="closeResults" class="close-results">×</button><div class="results-title">test complete</div><div id="resultsSubtitle" class="results-subtitle"></div><div class="results-big"><div><small>wpm</small><strong id="modalWpm">0</strong></div><div><small>raw</small><strong id="modalRaw">0</strong></div><div><small>accuracy</small><strong id="modalAcc">0%</strong></div><div><small>score</small><strong id="modalScore">0</strong></div></div><div class="graph-wrap"><div class="graph-label">performance</div><canvas id="wpmGraph"></canvas></div><div class="modal-actions"><button id="again" class="primary">try again</button></div></div></div>
<script src="script.js"></script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}</script>
</body></html>
